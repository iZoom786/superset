services:
  # Cube Semantic Layer
  cube:
    image: cubejs/cube:latest
    restart: unless-stopped
    ports:
      - "4000:4000"
      - "15432:15432"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      CUBEJS_DEV_MODE: true
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: 187.127.189.166
      CUBEJS_DB_PORT: ${CUBEJS_DB_PORT:-5432}
      CUBEJS_DB_NAME: ${CUBEJS_DB_NAME:-tradebase}
      CUBEJS_DB_USER: ${CUBEJS_DB_USER:-postgres}
      CUBEJS_DB_PASS: postgres
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET}
    volumes:
      - ./cube:/cube/conf
    networks:
      - tradebase_net

  # Apache Superset
  superset:
    image: amancevice/superset:6.0.0
    restart: unless-stopped
    ports:
      - "7088:8088"
    environment:
      SECRET_KEY: ${SERVICE_BASE64_64_SUPERSETSECRETKEY}
      MAPBOX_API_KEY: ${MAPBOX_API_KEY:-}
      POSTGRES_USER: ${SERVICE_USER_POSTGRES:-superset}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-superset-db}
      POSTGRES_HOST: superset-postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: superset-redis
      REDIS_PORT: "6379"
      # These match your Python config keys:
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@example.com}
      SUPERSET_CONFIG_PATH: /etc/superset/superset_config.py
    volumes:
      - ./superset/superset_config.py:/etc/superset/superset_config.py:ro
    depends_on:
      superset-postgres:
        condition: service_healthy
      superset-redis:
        condition: service_healthy
    command: ["/bin/sh", "-c", "superset db upgrade && superset init && gunicorn --bind 0.0.0.0:8088 --workers 4 --worker-class gthread --threads 20 --timeout 120 'superset.app:create_app()'"]
    networks:
      - tradebase_net

  # Superset metadata database
  superset-postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_USER=${SERVICE_USER_POSTGRES}'
      - 'POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}'
      - 'POSTGRES_DB=${POSTGRES_DB:-superset-db}'
    volumes:
      - 'superset_postgres_data:/var/lib/postgresql'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'
      interval: 5s
      timeout: 20s
      retries: 10
  # Superset cache and async backend
  superset-redis:
    image: redis:8
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${SERVICE_PASSWORD_REDIS}
    volumes:
      - superset_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${SERVICE_PASSWORD_REDIS} ping | grep PONG"]
      interval: 5s
      timeout: 10s
      retries: 15
    networks:
      - tradebase_net

volumes:
  superset_postgres_data:
  superset_redis_data:

networks:
  tradebase_net:
    driver: bridge
