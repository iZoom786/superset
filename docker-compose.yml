services:
  superset:
    image: amancevice/superset:6.0.0
    container_name: superset
    restart: unless-stopped
    ports:
      - "7088:8088"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=superset-postgres
      - POSTGRES_PORT=5432
    volumes:
      - ./superset_config.py:/etc/superset/superset_config.py:ro
    depends_on:
      - superset-postgres
      - superset-redis
    command: >
      /bin/sh -c "
        superset db upgrade &&
        superset init &&
        gunicorn --bind 0.0.0.0:8088 --workers 4 --worker-class gthread --threads 20 --timeout 120 'superset.app:create_app()'
      "
