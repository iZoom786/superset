services:
  superset:
    image: amancevice/superset:6.0.0
    container_name: superset
    restart: unless-stopped
    ports:
      - "7088:8088"
    environment:
      - SECRET_KEY=${SUPERSET_SECRET_KEY:-your-secret-key-here}
      - POSTGRES_USER=${SERVICE_USER_POSTGRES:-superset}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES:-Mypakistan@2357e}
      - POSTGRES_DB=${POSTGRES_DB:-superset-db}
      - POSTGRES_HOST=superset-postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=superset-redis
      - REDIS_PORT=6379
    volumes:
      - ./superset_config.py:/etc/superset/superset_config.py:ro
    depends_on:
      superset-postgres:
        condition: service_healthy
      superset-redis:
        condition: service_healthy
    command: >
      /bin/sh -c "
        superset db upgrade &&
        superset init &&
        gunicorn --bind 0.0.0.0:8088 --workers 4 --worker-class gthread --threads 20 --timeout 120 'superset.app:create_app()'
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  superset-postgres:
    image: postgres:15
    container_name: superset-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES:-superset}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES:-Mypakistan@2357e}
      - POSTGRES_DB=${POSTGRES_DB:-superset-db}
    volumes:
      - superset_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVICE_USER_POSTGRES:-superset}"]
      interval: 5s
      timeout: 20s
      retries: 10

  superset-redis:
    image: redis:8
    container_name: superset-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - superset_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 10s
      retries: 15

volumes:
  superset_postgres_data:
    name: superset_postgres_data
  superset_redis_data:
    name: superset_redis_data
