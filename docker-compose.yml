services:
  # ============================================================
  # CUBE SEMANTIC LAYER
  # ============================================================
  cube:
    image: cubejs/cube:latest
    container_name: cube
    restart: unless-stopped
    ports:
      - "4000:4000"
      - "15432:15432"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      CUBEJS_DEV_MODE: ${CUBEJS_DEV_MODE:-true}
      CUBEJS_DB_TYPE: ${CUBEJS_DB_TYPE:-postgres}
      CUBEJS_DB_HOST: ${CUBEJS_DB_HOST:-187.127.189.166}
      CUBEJS_DB_PORT: ${CUBEJS_DB_PORT:-5432}
      CUBEJS_DB_NAME: ${CUBEJS_DB_NAME:-tradebase}
      CUBEJS_DB_USER: ${CUBEJS_DB_USER:-postgres}
      CUBEJS_DB_PASS: ${CUBEJS_DB_PASS:-postgres}
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:-aquickbrownfoxjumpsoverlazydog}
    volumes:
      - ./cube:/cube/conf
    networks:
      - tradebase_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================================
  # APACHE SUPERSET
  # ============================================================
  superset:
    image: amancevice/superset:6.0.0
    container_name: superset
    restart: unless-stopped
    ports:
      - "7088:8088"
    environment:
      # Superset Secret
      SECRET_KEY: ${SERVICE_BASE64_64_SUPERSETSECRETKEY:-quickbrownfoxjumsoverlazrdog}
      
      # Database
      POSTGRES_USER: ${SERVICE_USER_POSTGRES:-superset}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:-Mypakistan@2357e}
      POSTGRES_DB: ${POSTGRES_DB:-superset-db}
      POSTGRES_HOST: superset-postgres
      POSTGRES_PORT: "5432"
      
      # Redis Cache
      REDIS_HOST: superset-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS:-Mypakistan@2357e}
      
      # Admin User
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-postgres}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@example.com}
      
      # Config Path
      SUPERSET_CONFIG_PATH: /etc/superset/superset_config.py
      
      # ⭐ SUPABASE JWT SECRET (Required)
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      
      # Mapbox (Optional)
      MAPBOX_API_KEY: ${MAPBOX_API_KEY:-}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
    volumes:
      - ./superset/superset_config.py:/etc/superset/superset_config.py:ro
      - superset_data:/app/superset_home
    depends_on:
      superset-postgres:
        condition: service_healthy
      superset-redis:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        pip install superset-auth-kit[api,redis] &&
        superset db upgrade &&
        superset authkit provision-roles &&
        superset init &&
        gunicorn --bind 0.0.0.0:8088 \
          --workers 4 \
          --worker-class gthread \
          --threads 20 \
          --timeout 120 \
          'superset.app:create_app()'
    networks:
      - tradebase_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ============================================================
  # SUPERSET METADATA DATABASE
  # ============================================================
  superset-postgres:
    image: postgres:15
    container_name: superset-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES:-superset}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES:-Mypakistan@2357e}
      - POSTGRES_DB=${POSTGRES_DB:-superset-db}
    volumes:
      - superset_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVICE_USER_POSTGRES:-superset} -d ${POSTGRES_DB:-superset-db}"]
      interval: 5s
      timeout: 20s
      retries: 10
    networks:
      - tradebase_net

  # ============================================================
  # SUPERSET CACHE & ASYNC BACKEND
  # ============================================================
  superset-redis:
    image: redis:8
    container_name: superset-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${SERVICE_PASSWORD_REDIS:-Mypakistan@2357e}
    volumes:
      - superset_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${SERVICE_PASSWORD_REDIS:-Mypakistan@2357e} ping | grep PONG"]
      interval: 5s
      timeout: 10s
      retries: 15
    networks:
      - tradebase_net

# ============================================================
# VOLUMES
# ============================================================
volumes:
  superset_data:
    name: superset_data
  superset_postgres_data:
    name: superset_postgres_data
  superset_redis_data:
    name: superset_redis_data

# ============================================================
# NETWORKS
# ============================================================
networks:
  tradebase_net:
    driver: bridge
    name: tradebase_net
